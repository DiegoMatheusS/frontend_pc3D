name: Frontend Admin and Store

on:
  pull_request:
    paths:
      - "src/admin/components/AdminAssistant.jsx"
      - "src/admin/services/adminService.js"
      - "src/admin/utils/aiImportContract.js"
      - "src/admin/Admin.css"
      - "src/components/Header/**"
      - "src/pages/Store/**"
      - "src/pages/ProductDetails/**"
      - "src/services/productsService.js"
      - "src/services/normalizers.js"
      - "src/data/productsMock.js"
      - "src/src/admin/components/AdminAssistant.jsx"
      - "src/src/admin/services/adminService.js"
      - "src/src/admin/utils/aiImportContract.js"
      - "src/src/admin/Admin.css"
      - "src/src/components/Header/**"
      - "src/src/pages/Store/**"
      - "src/src/pages/ProductDetails/**"
      - "src/src/services/productsService.js"
      - "src/src/services/normalizers.js"
      - "src/src/data/productsMock.js"
      - ".github/workflows/admin-assistant.yml"
  push:
    branches: [main]
    paths:
      - "src/admin/components/AdminAssistant.jsx"
      - "src/admin/services/adminService.js"
      - "src/admin/utils/aiImportContract.js"
      - "src/admin/Admin.css"
      - "src/components/Header/**"
      - "src/pages/Store/**"
      - "src/pages/ProductDetails/**"
      - "src/services/productsService.js"
      - "src/services/normalizers.js"
      - "src/data/productsMock.js"
      - "src/src/admin/components/AdminAssistant.jsx"
      - "src/src/admin/services/adminService.js"
      - "src/src/admin/utils/aiImportContract.js"
      - "src/src/admin/Admin.css"
      - "src/src/components/Header/**"
      - "src/src/pages/Store/**"
      - "src/src/pages/ProductDetails/**"
      - "src/src/services/productsService.js"
      - "src/src/services/normalizers.js"
      - "src/src/data/productsMock.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint da lógica alterada
        run: >
          npx eslint
          src/admin/components/AdminAssistant.jsx
          src/admin/services/adminService.js
          src/admin/utils/aiImportContract.js
          src/src/admin/components/AdminAssistant.jsx
          src/src/admin/services/adminService.js
          src/src/admin/utils/aiImportContract.js
          src/services/productsService.js
          src/src/services/productsService.js
          src/services/normalizers.js
          src/src/services/normalizers.js
      - name: Build da raiz
        run: npm run build
      - name: Build com /src como raiz
        working-directory: src
        run: |
          npm ci
          npm run build
