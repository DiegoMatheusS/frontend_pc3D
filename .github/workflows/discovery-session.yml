name: Resultados de descoberta

on:
  pull_request:
    paths:
      - 'src/admin/pages/AdminHardwareDiscovery.jsx'
      - 'src/admin/pages/AdminOfferDiscovery.jsx'
      - 'src/admin/hooks/useDiscoverySession.js'
      - 'src/admin/utils/discoverySession.js'
      - 'tests/discoverySession.test.mjs'
      - '.github/workflows/discovery-session.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/discoverySession.test.mjs
      - run: npx eslint src/admin/pages/AdminHardwareDiscovery.jsx src/admin/pages/AdminOfferDiscovery.jsx src/admin/hooks/useDiscoverySession.js src/admin/utils/discoverySession.js
      - run: npm run build
