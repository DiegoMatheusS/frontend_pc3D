name: Descoberta e paginação de hardware

on:
  pull_request:
    paths:
      - 'src/admin/pages/AdminHardwareDiscovery.jsx'
      - 'src/admin/utils/hardwareDiscovery.js'
      - 'src/admin/Admin.css'
      - 'tests/hardwareDiscovery*'
      - '.github/workflows/hardware-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/hardwareDiscovery*
      - run: npm run build
