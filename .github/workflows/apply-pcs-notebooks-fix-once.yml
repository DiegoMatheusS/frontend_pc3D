name: Aplicar correção PCs e notebooks uma vez

on:
  push:
    branches:
      - fix/pcs-click-notebooks-specs-20260930
    paths:
      - scripts/apply-pcs-notebooks-fix.mjs
      - .github/workflows/apply-pcs-notebooks-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pcs-click-notebooks-specs-20260930
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar correções
        run: node scripts/apply-pcs-notebooks-fix.mjs
      - name: Validar alterações
        run: |
          git diff --check
          npm run build
          grep -q "backlitKeyboard: booleanValue" src/services/normalizers.js
          grep -q "os: text(spec.os" src/services/normalizers.js
          grep -q "mounted-card__title" src/components/MountedPcCard/MountedPcCard.jsx
      - name: Commit das correções
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/normalizers.js src/src/services/normalizers.js src/pages/NotebookDetails/NotebookDetails.jsx src/src/pages/NotebookDetails/NotebookDetails.jsx src/components/MountedPcCard/MountedPcCard.jsx src/src/components/MountedPcCard/MountedPcCard.jsx src/components/MountedPcCard/MountedPcCard.css src/src/components/MountedPcCard/MountedPcCard.css
          git commit -m 'fix(ui): tornar PCs clicáveis e humanizar notebooks'
          git push origin HEAD:fix/pcs-click-notebooks-specs-20260930
